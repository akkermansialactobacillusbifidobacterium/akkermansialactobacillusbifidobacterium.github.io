<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT DECODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --bg2:     #111111;
      --border:  #2a2a2a;
      --accent:  #c8ff00;
      --accent2: #ff4d00;
      --text:    #e8e8e8;
      --dim:     #555;
      --dim2:    #333;
      --scan:    rgba(200,255,0,0.03);
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; overflow-x: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, var(--scan) 3px, var(--scan) 4px);
      pointer-events: none; z-index: 9999;
    }

    .container { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; max-width: 860px; margin: 0 auto; padding: 0 24px; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 28px 0 20px;
      display: flex; align-items: flex-end; gap: 20px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.2rem; letter-spacing: 0.12em;
      color: var(--accent); line-height: 1;
      text-shadow: 0 0 40px rgba(200,255,0,0.3);
      position: relative;
    }
    .logo span { color: var(--accent2); }

    @keyframes glitch {
      0%   { clip-path: inset(0 0 95% 0); transform: translate(-4px,0); }
      20%  { clip-path: inset(50% 0 30% 0); transform: translate(4px,0); }
      40%  { clip-path: inset(20% 0 60% 0); transform: translate(-2px,0); }
      60%  { clip-path: inset(80% 0 5% 0); transform: translate(3px,0); }
      80%  { clip-path: inset(10% 0 85% 0); transform: translate(-3px,0); }
      100% { clip-path: inset(0 0 95% 0); transform: translate(0,0); }
    }
    .logo::after {
      content: attr(data-text);
      position: absolute; left: 0; top: 0;
      color: var(--accent2);
      animation: glitch 6s infinite steps(1);
      opacity: 0.6;
    }

    .tagline { font-size: 0.65rem; color: var(--dim); letter-spacing: 0.2em; text-transform: uppercase; padding-bottom: 6px; }

    main { padding: 48px 0 64px; display: flex; flex-direction: column; gap: 40px; }

    .status-bar { display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: var(--dim); letter-spacing: 0.15em; text-transform: uppercase; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim2); transition: background 0.3s; }
    .status-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
    .status-dot.error  { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .form-block { display: flex; flex-direction: column; gap: 28px; }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field-label { font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    .field-label::before { content: '// '; color: var(--dim); }
    .field-hint { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.1em; }

    .field-input {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); font-family: 'IBM Plex Mono', monospace;
      font-size: 1.1rem; padding: 14px 18px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.04em; caret-color: var(--accent);
    }
    .field-input::placeholder { color: var(--dim); }
    .field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px rgba(200,255,0,0.03); }

    .normalized { font-size: 0.65rem; color: var(--dim); letter-spacing: 0.08em; height: 16px; transition: color 0.2s; }
    .normalized.has-value { color: #556633; }
    .normalized span { color: var(--accent); opacity: 0.7; }

    .decode-btn {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 0.25em; padding: 18px 40px;
      cursor: pointer; position: relative; overflow: hidden;
      transition: color 0.2s; align-self: flex-start; margin-top: 8px;
    }
    .decode-btn::before {
      content: ''; position: absolute; inset: 0;
      background: var(--accent); transform: translateX(-101%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); z-index: 0;
    }
    .decode-btn:hover::before { transform: translateX(0); }
    .decode-btn:hover { color: var(--bg); }
    .decode-btn span { position: relative; z-index: 1; }
    .decode-btn:disabled { border-color: var(--dim2); color: var(--dim2); cursor: not-allowed; }
    .decode-btn:disabled::before { display: none; }

    .verdict {
      display: flex; align-items: center; gap: 10px;
      margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border);
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .verdict-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; }
    .verdict.ok   .verdict-icon { background: var(--accent);  color: var(--bg); }
    .verdict.ok   .verdict-text { color: var(--accent); }
    .verdict.fail .verdict-icon { background: var(--accent2); color: var(--bg); }
    .verdict.fail .verdict-text { color: var(--accent2); }

    .images-section { display: none; flex-direction: column; gap: 16px; }
    .images-section.visible { display: flex; }

    .images-header { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .images-header span { color: var(--accent); }

    .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

    .img-card { border: 1px solid var(--border); background: var(--bg2); overflow: hidden; position: relative; }
    .img-card img { width: 100%; display: block; }
    .img-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); font-size: 0.55rem; letter-spacing: 0.15em; color: var(--dim); padding: 6px 10px; text-transform: uppercase; }

    .error-msg { font-size: 0.7rem; color: var(--accent2); letter-spacing: 0.08em; padding: 14px 0; display: none; }
    .error-msg.visible { display: block; }

    .progress-bar { height: 2px; background: var(--dim2); margin-top: -32px; display: none; }
    .progress-bar.visible { display: block; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    footer { border-top: 1px solid var(--border); padding: 16px 0; font-size: 0.58rem; color: var(--dim2); letter-spacing: 0.15em; text-transform: uppercase; display: flex; justify-content: space-between; }

    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--dim2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo" data-text="OSINT1">OSINT<span>1</span></div>
    <div class="tagline">encrypted asset decoder // key derivation</div>
  </header>

  <main>
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">oczekiwanie na dane wejściowe</span>
    </div>

    <div class="form-block">
      <div class="field">
        <div class="field-label">NAZWA</div>
        <input class="field-input" id="inputNazwa" type="text" placeholder="wpisz nazwę miejsca..." autocomplete="off" spellcheck="false" />
        <div class="normalized" id="normNazwa"></div>
      </div>

      <div class="field">
        <div class="field-label">NUMER</div>
        <input class="field-input" id="inputNumer" type="text" placeholder="wpisz numer..." autocomplete="off" spellcheck="false" />
        <div class="normalized" id="normNumer"></div>
        <div class="field-hint">prefiks "00" zostanie automatycznie usunięty</div>
      </div>

      <button class="decode-btn" id="decodeBtn" disabled>
        <span>⬡ DESZYFRUJ</span>
      </button>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="verdict" id="verdict" style="display:none">
      <div class="verdict-icon" id="verdictIcon"></div>
      <div class="verdict-text" id="verdictText"></div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="images-section" id="imagesSection">
      <div class="images-header">
        ODSZYFROWANE OBRAZY — <span id="imgCount">0</span> / 3
      </div>
      <div class="images-grid" id="imagesGrid"></div>
    </div>
  </main>

  <footer>
    <span>AES-256-CBC // SHA-256 KEY DERIVATION</span>
    <span>OSINT1 // geocaching</span>
  </footer>
</div>

<script>
  // --- KEY VALIDATION ---
  // Validation via known ciphertext — key is never stored in source
  const CHECK_IV = CryptoJS.enc.Hex.parse('cafebabe00000000cafebabe00000000');
  const CHECK_CT = CryptoJS.enc.Hex.parse('ff251400be664ddd2db7cd6f2ba2f90c');
  const CHECK_PT = 'OSINT1_CHECK_OK!';

  function isKeyCorrect(keyWords) {
    try {
      const dec = CryptoJS.AES.decrypt(
        { ciphertext: CHECK_CT },
        keyWords,
        { iv: CHECK_IV, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.NoPadding }
      );
      return dec.toString(CryptoJS.enc.Utf8) === CHECK_PT;
    } catch { return false; }
  }

  // --- ENCRYPTED FILES (served from same directory) ---
  const ENC_FILES = [
    { name: 'AB', path: 'AB.enc' },
    { name: 'C',  path: 'C.enc'  },
    { name: 'D',  path: 'D.enc'  },
  ];

  // --- DOM ---
  const inputNazwa   = document.getElementById('inputNazwa');
  const inputNumer   = document.getElementById('inputNumer');
  const normNazwa    = document.getElementById('normNazwa');
  const normNumer    = document.getElementById('normNumer');
  const decodeBtn    = document.getElementById('decodeBtn');
  const verdict      = document.getElementById('verdict');
  const verdictIcon  = document.getElementById('verdictIcon');
  const verdictText  = document.getElementById('verdictText');
  const statusDot    = document.getElementById('statusDot');
  const statusText   = document.getElementById('statusText');
  const errorMsg     = document.getElementById('errorMsg');
  const imagesSection = document.getElementById('imagesSection');
  const imagesGrid   = document.getElementById('imagesGrid');
  const imgCount     = document.getElementById('imgCount');
  const progressBar  = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');

  // --- NORMALIZE ---
  function normalize(nazwa, numer) {
    const n = nazwa.toLowerCase().replace(/\s+/g, '');
    const m = numer.replace(/\s+/g, '').replace(/^00+/, '');
    return n + m;
  }

  // --- LIVE PREVIEW ---
  function updatePreviews() {
    const nRaw = inputNazwa.value;
    const mRaw = inputNumer.value;

    if (nRaw) {
      normNazwa.className = 'normalized has-value';
      normNazwa.innerHTML = '→ <span>' + nRaw.toLowerCase().replace(/\s+/g, '') + '</span>';
    } else {
      normNazwa.className = 'normalized';
      normNazwa.innerHTML = '';
    }

    if (mRaw) {
      normNumer.className = 'normalized has-value';
      normNumer.innerHTML = '→ <span>' + mRaw.replace(/\s+/g, '').replace(/^00+/, '') + '</span>';
    } else {
      normNumer.className = 'normalized';
      normNumer.innerHTML = '';
    }

    const ready = nRaw.trim() !== '' && mRaw.trim() !== '';
    decodeBtn.disabled = !ready;
    if (ready) {
      statusDot.className = 'status-dot active';
      statusText.textContent = 'dane wejściowe gotowe — kliknij DESZYFRUJ';
    } else {
      statusDot.className = 'status-dot';
      statusText.textContent = 'oczekiwanie na dane wejściowe';
    }
  }

  inputNazwa.addEventListener('input', updatePreviews);
  inputNumer.addEventListener('input', updatePreviews);

  // --- DECODE ---
  decodeBtn.addEventListener('click', async () => {
    const nRaw = inputNazwa.value.trim();
    const mRaw = inputNumer.value.trim();
    if (!nRaw || !mRaw) return;

    // reset UI
    decodeBtn.disabled = true;
    decodeBtn.querySelector('span').innerHTML = '<span class="spinner"></span>DESZYFRUJE...';
    errorMsg.classList.remove('visible');
    imagesSection.classList.remove('visible');
    imagesGrid.innerHTML = '';
    verdict.style.display = 'none';
    progressBar.classList.remove('visible');
    progressFill.style.width = '0%';

    statusDot.className = 'status-dot active';
    statusText.textContent = 'obliczanie klucza...';
    await tick();

    // derive key
    const combined = normalize(nRaw, mRaw);
    const keyWords = CryptoJS.SHA256(combined);

    // validate
    const valid = isKeyCorrect(keyWords);
    verdict.style.display = 'flex';
    verdict.className = 'verdict ' + (valid ? 'ok' : 'fail');
    verdictIcon.textContent = valid ? '✓' : '✕';
    verdictText.textContent = valid
      ? 'klucz prawidłowy — ładowanie obrazów...'
      : 'klucz nieprawidłowy — sprawdź dane wejściowe';

    if (!valid) {
      statusDot.className = 'status-dot error';
      statusText.textContent = 'nieprawidłowy klucz';
      decodeBtn.disabled = false;
      decodeBtn.querySelector('span').textContent = '⬡ DESZYFRUJ';
      return;
    }

    // decrypt files
    progressBar.classList.add('visible');
    statusText.textContent = 'deszyfrowanie plików...';

    let decoded = 0;
    let errors  = 0;

    for (let i = 0; i < ENC_FILES.length; i++) {
      const { name, path } = ENC_FILES[i];
      progressFill.style.width = Math.round((i / ENC_FILES.length) * 100) + '%';
      await tick();

      try {
        const resp = await fetch(path);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const buf   = await resp.arrayBuffer();
        const bytes = new Uint8Array(buf);

        // format: [16 bytes IV][ciphertext...]
        const iv         = CryptoJS.lib.WordArray.create(bytes.slice(0, 16));
        const ciphertext = CryptoJS.lib.WordArray.create(bytes.slice(16));

        const decrypted = CryptoJS.AES.decrypt(
          { ciphertext },
          keyWords,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );

        const decBytes = wordArrayToUint8Array(decrypted);

        // detect mime
        let mime = 'image/jpeg';
        if (decBytes[0] === 0x89 && decBytes[1] === 0x50) mime = 'image/png';
        else if (decBytes[0] === 0x47 && decBytes[1] === 0x49) mime = 'image/gif';

        const blob = new Blob([decBytes], { type: mime });
        const url  = URL.createObjectURL(blob);

        const card = document.createElement('div');
        card.className = 'img-card';
        card.innerHTML = `<img src="${url}" alt="${name}" /><div class="img-label">${name}</div>`;
        imagesGrid.appendChild(card);
        decoded++;

      } catch (e) {
        errors++;
        console.error(name, e);
      }
    }

    progressFill.style.width = '100%';
    await tick();
    progressBar.classList.remove('visible');

    imgCount.textContent = decoded;
    imagesSection.classList.add('visible');

    if (errors > 0) {
      showError(`${errors} plik(i) nie mogły zostać odszyfrowane.`);
    }

    verdictText.textContent = decoded > 0
      ? `klucz prawidłowy — odszyfrowano ${decoded} / ${ENC_FILES.length} obrazów`
      : 'błąd deszyfrowania';

    statusDot.className = decoded > 0 ? 'status-dot active' : 'status-dot error';
    statusText.textContent = decoded > 0
      ? `odszyfrowano ${decoded} z ${ENC_FILES.length} obrazów`
      : 'błąd — sprawdź klucz lub pliki';

    decodeBtn.disabled = false;
    decodeBtn.querySelector('span').textContent = '⬡ DESZYFRUJ';
  });

  // --- HELPERS ---
  function wordArrayToUint8Array(wa) {
    const words = wa.words, len = wa.sigBytes;
    const u8 = new Uint8Array(len);
    for (let i = 0; i < len; i++)
      u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
    return u8;
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  function tick() { return new Promise(r => setTimeout(r, 20)); }
</script>
</body>
</html>
